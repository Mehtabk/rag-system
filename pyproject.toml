[project]
name = "rag-system"
version = "0.1.0"
description = "A production-grade RAG system skeleton: decoupled index/query paths, hybrid retrieval, reranking, guardrails, and first-class evals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real provider backends — install what you actually use.
providers = [
    "openai>=1.54",
    "cohere>=5.11",
    "pinecone-client>=5.0",
]
# Offline semantic embeddings — no API keys, runs on CPU.
local = [
    "sentence-transformers>=3.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
