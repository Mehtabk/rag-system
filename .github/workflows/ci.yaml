name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Pin the dependency-free embedder so CI stays fast, deterministic, and
      # offline (no model download). Real use defaults to the local model.
      RAG_EMBEDDINGS_PROVIDER: hashing
      RAG_EMBEDDINGS_MODEL: local-hash-256
      RAG_EMBEDDINGS_DIM: "256"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests evals
      - name: Unit + integration tests
        run: pytest -q
      - name: Eval regression gate
        run: python -m evals.run_eval
